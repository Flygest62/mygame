<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Своя игра КДМ</title>
<style>
:root{--bg-0:#06122c;--blue:#1a3a8a;--blue-deep:#122a5c;--green:#1e6b3a;--green-dark:#145028;--red:#c41e2a;--red-dark:#8e141d;--gold:#f0c419;--text:#e8eefc;--muted:#7a89b0;--purple:#8a4dff;--purple-light:#b98bff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg-0);background-image:radial-gradient(ellipse at 50% 0%,#122a5c 0%,#06122c 65%);min-height:100vh;color:var(--text);padding:40px 20px;letter-spacing:.02em;-webkit-font-smoothing:antialiased;}
.screen{display:none;}.screen.active{display:block;}
.header{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;max-width:1200px;margin:0 auto 24px;padding-bottom:24px;}
.header-brand{display:flex;align-items:center;gap:20px;}
.header-logo{height:78px;filter:drop-shadow(0 0 14px rgba(240,196,25,.35));}
.header-title{display:flex;flex-direction:column;gap:6px;}
.header h1{font-family:Georgia,serif;font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);line-height:1.1;text-shadow:0 2px 12px rgba(240,196,25,.25);}
.header .subtitle{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:#9aa8d0;}
.header-actions{display:flex;gap:20px;flex-wrap:wrap;align-items:center;}
.btn-reset{background:transparent;color:var(--gold);border:none;padding:10px 4px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:color .2s,opacity .2s;}
.btn-reset:hover{color:#fff;opacity:.85;}
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1200px;margin:0 auto;}
.game-card{background:linear-gradient(180deg,var(--blue) 0%,var(--blue-deep) 100%);padding:24px;display:flex;flex-direction:column;gap:14px;}
.game-card-title{font-family:Georgia,serif;font-size:20px;font-weight:700;color:var(--gold);letter-spacing:.08em;}
.game-card-subtitle{font-size:12px;color:#9aa8d0;letter-spacing:.15em;text-transform:uppercase;min-height:15px;}
.game-card-meta{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:auto;}
.game-card-actions{display:flex;gap:10px;align-items:center;margin-top:8px;}
.btn-play{flex:1;background:var(--gold);color:var(--bg-0);border:none;padding:12px 16px;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;}
.btn-play:hover{opacity:.9;}
.icon-btn{background:transparent;color:var(--gold);border:1px solid rgba(240,196,25,.4);width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn:hover{background:var(--gold);color:var(--bg-0);}
.icon-btn svg{width:18px;height:18px;}
.add-game-wrap{max-width:1200px;margin:28px auto 0;display:flex;justify-content:center;}
.btn-add-game{background:transparent;color:var(--gold);border:2px dashed rgba(240,196,25,.5);padding:18px 40px;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.25em;text-transform:uppercase;cursor:pointer;}
.btn-add-game:hover{border-color:var(--gold);background:rgba(240,196,25,.08);}
.menu-empty{max-width:1200px;margin:40px auto;text-align:center;color:var(--muted);font-size:14px;}
.round-nav{max-width:1200px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;gap:20px;}
.round-nav-btn{background:transparent;color:var(--gold);border:1px solid rgba(240,196,25,.4);width:40px;height:40px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.round-nav-btn:hover:not(:disabled){background:var(--gold);color:var(--bg-0);}
.round-nav-btn:disabled{opacity:.3;cursor:not-allowed;}
.round-nav-label{font-family:Georgia,serif;font-size:clamp(14px,1.6vw,18px);font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);min-width:220px;text-align:center;}
.score-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:1200px;margin:0 auto 16px;}
.score-card{background:linear-gradient(180deg,var(--blue) 0%,var(--blue-deep) 100%);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;border:2px solid transparent;}
.score-card.leader{background:linear-gradient(180deg,var(--green) 0%,var(--green-dark) 100%);box-shadow:0 0 0 2px var(--gold) inset;}
.score-card.answering{border-color:var(--gold);}
.score-card-name{font-family:Georgia,serif;font-size:15px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;}
.score-card-score{font-family:Georgia,serif;font-size:28px;font-weight:700;color:#fff;}
.score-card.negative .score-card-score{color:#ff8b8b;}
.board{display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:4px;max-width:1200px;margin:0 auto;}
.cell-topic{background:linear-gradient(180deg,var(--green) 0%,var(--green-dark) 100%);padding:22px 12px;font-family:Georgia,serif;font-size:clamp(11px,1.4vw,14px);font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);text-align:center;display:flex;align-items:center;justify-content:center;min-height:64px;}
.cell-points{background:linear-gradient(180deg,var(--blue) 0%,var(--blue-deep) 100%);color:var(--gold);font-family:Georgia,serif;font-size:clamp(18px,2.2vw,26px);font-weight:700;padding:32px 8px;text-align:center;cursor:pointer;user-select:none;}
.cell-points:hover{background:linear-gradient(180deg,#2a52b8 0%,var(--blue) 100%);color:#fff;}
.cell-points.answered{background:linear-gradient(180deg,var(--red) 0%,var(--red-dark) 100%);color:transparent;cursor:default;pointer-events:none;}
.modal-overlay{position:fixed;inset:0;background:var(--bg-0);background-image:radial-gradient(ellipse at 50% 40%,#122a5c 0%,#06122c 70%);display:none;z-index:100;}
.modal-overlay.open{display:flex;}
.modal{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;text-align:center;overflow-y:auto;}
.modal-topic{font-size:clamp(13px,1.4vw,15px);letter-spacing:.35em;text-transform:uppercase;color:#f0c419;margin-bottom:12px;font-weight:700;}
.modal-points{font-family:Georgia,serif;font-size:clamp(24px,2.6vw,34px);color:var(--bg-0);background:var(--gold);padding:8px 28px;margin-bottom:16px;font-weight:700;display:inline-flex;align-items:baseline;gap:10px;}
.modal-points.pos{background:#7ed996;}
.modal-points.neg{background:#ff8b8b;}
.modal-points .mod-badge{font-size:.6em;letter-spacing:.15em;}
.modal-points .base-val{font-size:.6em;opacity:.55;text-decoration:line-through;}
.modal-question{font-family:Georgia,serif;font-size:clamp(24px,3.5vw,44px);line-height:1.4;color:#fff;max-width:1000px;margin:0 auto 32px;}
.modal img{max-width:80vw;max-height:38vh;object-fit:contain;margin-bottom:24px;}
.modal-answer{display:none;font-family:Georgia,serif;font-size:clamp(20px,2.6vw,34px);line-height:1.35;color:var(--gold);max-width:1000px;padding:20px 40px;margin-bottom:24px;font-weight:700;white-space:pre-line;text-align:left;}
.modal-answer.visible{display:block;}
.modal-answer-preview{display:block;font-family:Georgia,serif;font-size:clamp(13px,1.5vw,18px);line-height:1.4;color:#9aa8d0;max-width:1000px;margin:-20px auto 24px;padding:12px 24px;border-left:3px solid var(--gold);text-align:left;white-space:pre-line;font-style:italic;opacity:.75;}
.modal-score-panel{display:none;gap:10px;width:100%;max-width:720px;margin-top:24px;flex-wrap:wrap;justify-content:center;}
body.public-mode .modal-score-panel{display:flex;}
.modal-score-panel .score-card{flex:1;min-width:120px;padding:10px 14px;background:rgba(26,58,138,.6);}
.modal-score-panel .score-card-name{font-size:14px;}
.modal-score-panel .score-card-score{font-size:24px;}
.modifier-intro{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;width:100%;max-width:100%;padding:0 20px;}
.modifier-intro-word{font-family:Georgia,serif;font-size:clamp(28px,7vw,100px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--purple-light);text-shadow:0 6px 50px rgba(138,77,255,.8);line-height:1.1;text-align:center;max-width:100%;word-break:break-word;}
.modifier-panel{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:720px;margin-bottom:24px;}
.modifier-icon{font-size:90px;line-height:1;}
.modifier-title{font-family:Georgia,serif;font-size:clamp(30px,5vw,60px);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--purple-light);}
.modifier-desc{font-family:Georgia,serif;font-size:clamp(16px,2vw,24px);color:#fff;letter-spacing:.05em;max-width:700px;line-height:1.5;}
.pass-panel{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:720px;}
.modal-select{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:720px;}
.select-players{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;}
.select-player-btn{background:rgba(26,58,138,.5);border:2px solid transparent;color:#fff;padding:20px 12px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px;}
.select-player-btn:hover{background:rgba(42,82,184,.65);border-color:var(--gold);}
.select-player-name{font-family:Georgia,serif;font-size:16px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;}
.select-player-score{font-family:Georgia,serif;font-size:22px;font-weight:700;color:#fff;}
.auction-panel{display:flex;flex-direction:column;align-items:center;gap:20px;width:100%;max-width:720px;}
.bid-row{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;max-width:420px;}
.bid-btn{background:transparent;border:2px solid var(--gold);color:var(--gold);width:54px;height:54px;font-size:24px;font-weight:700;cursor:pointer;font-family:Georgia,serif;}
.bid-btn:hover{background:var(--gold);color:var(--bg-0);}
.bid-input{flex:1;background:rgba(26,58,138,.5);border:2px solid var(--gold);color:#fff;font-family:Georgia,serif;font-size:32px;font-weight:700;padding:12px 20px;text-align:center;outline:none;}
.bid-presets{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.bid-preset{background:transparent;border:1px solid rgba(240,196,25,.5);color:var(--gold);padding:8px 16px;font-family:inherit;font-size:12px;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;}
.bid-preset:hover{background:rgba(240,196,25,.15);}
.scoring-panel{display:none;flex-direction:column;gap:20px;width:100%;max-width:720px;margin-top:8px;}
.scoring-panel.visible{display:flex;}
.player-select-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.player-select-btn{background:rgba(26,58,138,.5);border:2px solid transparent;color:#fff;padding:16px 10px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;}
.player-select-btn:hover:not(.locked){background:rgba(42,82,184,.65);}
.player-select-btn.selected{border-color:var(--gold);background:rgba(240,196,25,.18);box-shadow:0 0 0 1px var(--gold) inset;}
.player-select-btn.locked{opacity:.35;cursor:not-allowed;}
.psb-name{font-family:Georgia,serif;font-size:16px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;text-align:center;word-break:break-word;}
.psb-score{font-family:Georgia,serif;font-size:26px;font-weight:700;color:#fff;}
.psb-score.negative{color:#ff8b8b;}
.adjust-row{display:flex;justify-content:center;align-items:center;gap:12px;}
.adjust-btn{background:transparent;border:2px solid;padding:14px 28px;font-family:Georgia,serif;font-size:20px;font-weight:700;letter-spacing:.08em;cursor:pointer;min-width:80px;}
.adjust-btn.minus{color:#ff8b8b;border-color:var(--red);}
.adjust-btn.minus:hover:not(:disabled){background:var(--red);color:#fff;}
.adjust-btn.plus{color:#7ed996;border-color:var(--green);}
.adjust-btn.plus:hover:not(:disabled){background:var(--green);color:#fff;}
.adjust-btn:disabled{opacity:.35;cursor:not-allowed;}
.adjust-btn.flip{color:var(--purple-light);border-color:var(--purple);min-width:320px;}
.adjust-btn.flip:hover:not(:disabled){background:var(--purple);color:#fff;}
.score-input{width:120px;background:#06122c;border:2px solid var(--gold);color:#fff;font-family:Georgia,serif;font-size:24px;font-weight:700;text-align:center;padding:10px;outline:none;}
.break-overlay{position:fixed;inset:0;background:var(--bg-0);background-image:radial-gradient(ellipse at 50% 40%,#122a5c 0%,#06122c 70%);display:none;z-index:200;}
.break-overlay.open{display:flex;}
.break-content{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:60px 40px;text-align:center;overflow-y:auto;}
.break-label{font-family:Georgia,serif;font-size:clamp(12px,1.4vw,15px);letter-spacing:.5em;text-transform:uppercase;color:#9aa8d0;margin-bottom:24px;font-weight:700;}
.break-title{font-family:Georgia,serif;font-size:clamp(40px,7vw,100px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);line-height:1;margin-bottom:32px;}
.break-subtitle{font-family:Georgia,serif;font-size:clamp(18px,2.4vw,30px);color:#fff;letter-spacing:.1em;margin-bottom:40px;}
.break-scores{width:100%;max-width:600px;margin:0 auto 40px;display:flex;flex-direction:column;gap:8px;}
.break-score-row{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:rgba(26,58,138,.45);font-family:Georgia,serif;font-size:20px;}
.break-score-row.winner{background:linear-gradient(180deg,var(--green) 0%,var(--green-dark) 100%);font-size:22px;font-weight:700;box-shadow:0 0 0 2px var(--gold) inset;}
.break-score-row.loser{opacity:.8;}
.break-score-name{color:var(--gold);text-transform:uppercase;}
.break-score-value{color:#fff;font-weight:700;}
.final-overlay{position:fixed;inset:0;background:var(--bg-0);background-image:radial-gradient(ellipse at 50% 40%,#122a5c 0%,#06122c 70%);display:none;z-index:250;}
.final-overlay.open{display:flex;}
.final-content{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px;text-align:center;overflow-y:auto;}
.final-label{font-family:Georgia,serif;font-size:clamp(12px,1.4vw,15px);letter-spacing:.5em;text-transform:uppercase;color:#9aa8d0;margin-bottom:20px;font-weight:700;}
.final-turn{font-family:Georgia,serif;font-size:clamp(22px,3vw,38px);font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:40px;}
.final-topics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:1200px;width:100%;margin-bottom:40px;}
.final-topic-card{background:linear-gradient(180deg,var(--blue) 0%,var(--blue-deep) 100%);color:var(--gold);font-family:Georgia,serif;font-size:clamp(12px,1.4vw,18px);font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:28px 12px;text-align:center;cursor:pointer;user-select:none;min-height:100px;display:flex;align-items:center;justify-content:center;}
.final-topic-card:hover{background:linear-gradient(180deg,#2a52b8 0%,var(--blue) 100%);color:#fff;}
.final-reveal-title{font-family:Georgia,serif;font-size:clamp(48px,10vw,140px);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);line-height:1.05;margin:20px 0 60px;padding:0 20px;}
.final-question-text{font-family:Georgia,serif;font-size:clamp(24px,3.5vw,44px);line-height:1.4;color:#fff;max-width:1000px;margin:0 auto 30px;}
.final-topic-small{font-family:Georgia,serif;font-size:clamp(13px,1.4vw,15px);letter-spacing:.35em;text-transform:uppercase;color:#f0c419;margin-bottom:20px;font-weight:700;}
.final-answer-text{display:none;font-family:Georgia,serif;font-size:clamp(20px,2.8vw,38px);line-height:1.35;color:var(--gold);max-width:1000px;padding:20px 40px;font-weight:700;margin-bottom:20px;white-space:pre-line;text-align:left;}
.final-answer-text.visible{display:block;}
.editor-overlay{position:fixed;inset:0;background:rgba(6,18,44,.97);display:none;z-index:400;}
.editor-overlay.open{display:flex;}
.editor-content{width:100%;height:100%;display:flex;flex-direction:column;padding:24px 32px;}
.editor-header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:12px;}
.editor-title-wrap{display:flex;flex-direction:column;gap:4px;}
.editor-header h2{font-family:Georgia,serif;color:var(--gold);font-size:20px;letter-spacing:.2em;text-transform:uppercase;}
.editor-game-title{font-size:12px;color:#9aa8d0;letter-spacing:.15em;text-transform:uppercase;}
.editor-actions{display:flex;gap:16px;flex-wrap:wrap;}
#editorTextarea{flex:1;background:#0b1a3e;color:#e8eefc;border:1px solid rgba(240,196,25,.3);padding:16px;font-family:'Consolas','Monaco',monospace;font-size:13px;line-height:1.55;resize:none;outline:none;}
#editorTextarea:focus{border-color:var(--gold);}
.editor-status{margin-top:12px;min-height:20px;font-size:13px;}
.editor-status.ok{color:#5cd07a;}.editor-status.err{color:#ff6b6b;}
body.public-mode .header-actions{display:none!important;}
body.fullscreen-mode .header-actions{display:none!important;}
body.public-mode .round-nav-btn{display:none!important;}
body.public-mode .round-nav{gap:0;}
body.public-mode .cell-points{pointer-events:none!important;cursor:default!important;}
body.public-mode .cell-points:hover{background:linear-gradient(180deg,var(--blue) 0%,var(--blue-deep) 100%);color:var(--gold);}
body.public-mode .scoring-panel{display:none!important;}
body.public-mode .adjust-row{display:none!important;}
body.public-mode .modal-answer-preview{display:none!important;}

/* Стили для экрана телефона */
#playerScreen { padding: 20px; text-align: center; }
.player-input { padding: 15px; font-size: 20px; text-align: center; width: 100%; margin-bottom: 15px; border: 2px solid var(--gold); background: #06122c; color: #fff; border-radius: 8px; outline: none; }
.player-btn { background: var(--gold); color: var(--bg-0); font-size: 22px; font-weight: bold; padding: 15px; width: 100%; border: none; border-radius: 8px; cursor: pointer; }
.buzz-btn { background: var(--red); color: white; font-size: 28px; font-weight: bold; padding: 20px; border-radius: 50%; width: 200px; height: 200px; border: 6px solid var(--red-dark); box-shadow: 0 0 30px rgba(196,30,42,0.8); cursor: pointer; user-select: none; margin: 20px auto; display: none; }
.player-topic-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 20px; }
.player-topic-btn { background: rgba(26,58,138,.8); border: 2px solid var(--gold); color: #fff; padding: 15px 10px; border-radius: 8px; cursor: pointer; text-align: center; }
.player-topic-btn .pt-title { font-size: 12px; color: var(--gold); text-transform: uppercase; }
.player-topic-btn .pt-points { font-size: 22px; font-weight: bold; margin-top: 5px; }

@media(max-width:900px){.final-topics{grid-template-columns:repeat(3,1fr);}}
@media(max-width:700px){body{padding:20px 10px;}.header{margin-bottom:16px;padding-bottom:16px;gap:14px;}.header-logo{height:56px;}.cell-topic{padding:14px 6px;min-height:52px;letter-spacing:.12em;}.cell-points{padding:22px 4px;}.modal{padding:30px 16px;}.break-content{padding:30px 20px;}.final-content{padding:30px 16px;}.final-topics{grid-template-columns:repeat(2,1fr);gap:8px;}.editor-content{padding:16px;}.round-nav-label{letter-spacing:.2em;min-width:160px;}.round-nav{gap:12px;}.player-select-row,.select-players{gap:6px;}.player-select-btn,.select-player-btn{padding:10px 4px;}.psb-name,.select-player-name{font-size:12px;}.psb-score,.select-player-score{font-size:20px;}.adjust-btn{padding:10px 16px;font-size:16px;min-width:60px;}.score-input{width:80px;font-size:18px;padding:8px;}.adjust-btn.flip{min-width:220px;font-size:14px;}.bid-input{font-size:24px;padding:8px 12px;}.bid-btn{width:44px;height:44px;font-size:20px;}.modifier-icon{font-size:64px;}.modal-answer{padding:16px 20px;text-align:left;}}
@media(max-width:480px){.header h1{letter-spacing:.14em;}.header-logo{height:46px;}.header .subtitle{letter-spacing:.25em;font-size:10px;}.board{grid-template-columns:1.2fr repeat(5,1fr);}.score-panel{grid-template-columns:1fr;}}
</style>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

<div class="screen active" id="menuScreen">
    <header class="header">
        <div class="header-brand">
            <img src="logo.png.jpg" alt="Герб КДМ" class="header-logo">
            <div class="header-title">
                <h1>Мои игры</h1>
                <span class="subtitle">Своя игра · КДМ · 1999</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-reset" id="btnMenuFullscreen">На весь экран (F)</button>
        </div>
    </header>
    <div class="games-grid" id="gamesGrid"></div>
    <div class="add-game-wrap">
        <button class="btn-add-game" id="btnAddGame">+ Новая игра</button>
    </div>
</div>

<div class="screen" id="gameScreen">
    <header class="header">
        <div class="header-brand">

function migrateGame(game) {
    if (!Array.isArray(game.players)) {
        game.players = ['Амина','Испай','Шавла'];
    }
    if (typeof game.finalQuestionValue !== 'number') game.finalQuestionValue = 1000;
    if (!Array.isArray(game.rounds)) game.rounds = [];
    game.rounds.forEach(function(r, i) {
        if (!Array.isArray(r.playerIndices)) {
            r.playerIndices = [i*3, i*3+1, i*3+2].filter(function(n) { return n < game.players.length; });
        }
    });
    if (!Array.isArray(game.finalTopics)) game.finalTopics = [];
    return game;
}

function loadData() {
    try {
        var saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.games) && parsed.games.length) {
                parsed.games.forEach(migrateGame);
                return parsed;
            }
        }
        for (var i = 0; i < OLD_KEYS.length; i++) {
            var legacy = localStorage.getItem(OLD_KEYS[i]);
            if (legacy) {
                try {
                    var old = JSON.parse(legacy);
                    if (old && Array.isArray(old.games)) { old.games.forEach(migrateGame); return old; }
                } catch (e) {}
            }
        }
    } catch (e) {}
    return deepClone(DEFAULT_DATA);
}

function saveData() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appData)); } catch (e) {}
}

function deleteGame(id, title) {

    saveData();
    renderMenu();
}

function getGame(id) {
    for (var i = 0; i < appData.games.length; i++) {
        if (appData.games[i].id === id) return appData.games[i];
    }
    return null;
}

function startGame(gameId) {
    var game = getGame(gameId);
    if (!game) return;
    migrateGame(game);
    currentGameId = gameId; currentGame = game; currentRound = 0;
    answeredCells = new Set(); currentCell = null; gameFinished = false;
    modalState = 'question';
    catReceiverPi = null; auctionWinnerPi = null; auctionBid = 0; secretModifierKey = null;
    passReceiverPi = null; passValue = 0;
    roundScores = {};
    game.rounds.forEach(function(r, idx) {
        roundScores[idx] = {};
        (r.playerIndices || []).forEach(function(pi) { roundScores[idx][pi] = 0; });
    });
    roundWinners = {}; finalists = []; finalScores = {};
    gameTitleEl.textContent = game.title || 'Своя игра';
    gameSubtitleEl.textContent = game.subtitle || '';
    renderBoard(); renderScorePanel(); showScreen('gameScreen');
    
    // Мультиплеер: инициализация ведущего
    if (!IS_PUBLIC && !playerMode && typeof initMQTT === 'function') initMQTT(true, roomCode);

function renderBoard() {
    board.innerHTML = '';
    if (!currentGame) return;
    var round = currentGame.rounds[currentRound];
    if (!round) return;
    var corner = document.createElement('div');
    corner.className = 'cell-topic'; corner.textContent = 'Темы / Баллы';
    board.appendChild(corner);
    round.points.forEach(function(p) {
        var el = document.createElement('div');
        el.className = 'cell-topic'; el.textContent = p;
        board.appendChild(el);
    });
    round.topics.forEach(function(topic, ti) {
        var title = document.createElement('div');
        title.className = 'cell-topic'; title.textContent = topic.title;
        board.appendChild(title);
        topic.questions.forEach(function(q, qi) {
            var cell = document.createElement('div');
            cell.className = 'cell-points';
            cell.textContent = q.points;
            var key = currentRound + '-' + ti + '-' + qi;
            if (answeredCells.has(key)) cell.classList.add('answered');
            cell.dataset.key = key;
            cell.dataset.topic = topic.title;
            cell.dataset.points = q.points;
            cell.dataset.question = q.question || '';
            cell.dataset.answer = q.answer || '';
            if (q.image) cell.dataset.image = q.image;
            if (q.type) cell.dataset.type = q.type;
            if (q.modifier) cell.dataset.modifier = q.modifier;
            if (q.modTitle) cell.dataset.modTitle = q.modTitle;
            if (q.modDesc) cell.dataset.modDesc = q.modDesc;
            if (q.modIcon) cell.dataset.modIcon = q.modIcon;
            if (typeof q.modValue === 'number') cell.dataset.modValue = q.modValue;
            if (typeof q.minValue === 'number') cell.dataset.minValue = q.minValue;
            if (typeof q.maxValue === 'number') cell.dataset.maxValue = q.maxValue;
            cell.addEventListener('click', function() { openQuestion(cell); });
            board.appendChild(cell);
        });
    });
    updateRoundNav();
}

function updateRoundNav() {
    var total = currentGame.rounds.length;
    roundIndicator.textContent = 'Раунд ' + (currentRound + 1) + ' из ' + total;
    prevRoundBtn.disabled = currentRound === 0;
    nextRoundBtn.disabled = false;
}

function goToRound(idx) {
    if (idx < 0 || idx >= currentGame.rounds.length) return;
    currentRound = idx;
    if (!roundScores[idx]) {
        roundScores[idx] = {};
        (currentGame.rounds[idx].playerIndices || []).forEach(function(pi) { roundScores[idx][pi] = 0; });
    }
    renderBoard(); renderScorePanel();
}

function nextRound() {
    var total = currentGame.rounds.length;
    if (currentRound < total - 1) goToRound(currentRound + 1);
    else showFinalIntro();
}

function renderScorePanel() {
    scorePanel.innerHTML = '';
    if (modalScorePanel) modalScorePanel.innerHTML = '';
    if (!currentGame) return;
    var round = currentGame.rounds[currentRound];
    if (!round) return;
    var playerIndices = round.playerIndices || [];
    var maxScore = -Infinity, leaderPi = null;
    playerIndices.forEach(function(pi) {
        var s = (roundScores[currentRound] && roundScores[currentRound][pi]) || 0;
        if (s > maxScore) { maxScore = s; leaderPi = pi; }
    });
    var hasLeader = maxScore > 0;
    playerIndices.forEach(function(pi) {
        var name = currentGame.players[pi] || ('Игрок ' + (pi + 1));
        var score = (roundScores[currentRound] && roundScores[currentRound][pi]) || 0;
        var card = document.createElement('div');
        card.className = 'score-card';
        if (hasLeader && pi === leaderPi) card.classList.add('leader');
        if (selectedScoringPi === pi) card.classList.add('answering');
        if (score < 0) card.classList.add('negative');
        card.innerHTML = '<div class="score-card-name"></div><div class="score-card-score"></div>';
        card.querySelector('.score-card-name').textContent = name;
        card.querySelector('.score-card-score').textContent = score;
        scorePanel.appendChild(card);

        if (modalScorePanel) {
            var mc = card.cloneNode(true);
            modalScorePanel.appendChild(mc);
        }
    });
}

function getModifierKey(cell) {
    if (!cell) return null;
    if (cell.dataset.type === 'secret') return secretModifierKey;
    return cell.dataset.modifier || null;
}

function computeValue(cell) {
    var base = parseInt(cell.dataset.points, 10) || 0;
    var key = getModifierKey(cell);
    if (!key || !MODIFIER_REGISTRY[key]) return base;
    var m = MODIFIER_REGISTRY[key];
    if (m.special === 'flip' || !m.apply) return base;
    return Math.max(0, Math.round(m.apply(base)));
}

function openQuestion(cell) {
    currentCell = cell;
    catReceiverPi = null; auctionWinnerPi = null; auctionBid = 0; secretModifierKey = null;
    passReceiverPi = null; passValue = 0;
    hideAllModalPanels();
    var type = cell.dataset.type || 'normal';
    
    if (mqttClient && !playerMode) {
        mqttClient.publish("svoya_game_" + roomCode, JSON.stringify({ type: 'question_opened' }));
    }
    
    if (type === 'modifier') {
        modalState = 'modifier-intro';
        modifierIntro.style.display = 'flex';
        modalOverlay.classList.add('open');
        return;
    }
    if (type === 'secret') {
        var pool = SECRET_MODIFIER_POOL.slice();
        secretModifierKey = pool[Math.floor(Math.random() * pool.length)];
    }
    if (type === 'cat') {
        modalState = 'cat-select';
        catTopicLabel.textContent = cell.dataset.topic;
        buildCatSelectRow();
        catSelectPanel.style.display = 'flex';
        modalOverlay.classList.add('open');
        return;
    }
    if (type === 'auction') {
        modalState = 'auction';
        auctionTopicLabel.textContent = cell.dataset.topic;
        var base = parseInt(cell.dataset.points, 10) || 100;
        bidInput.value = base; bidInput.step = base;
        buildAuctionPresets(base);
        buildAuctionSelectRow();
        auctionPanel.style.display = 'flex';
        modalOverlay.classList.add('open');
        return;
    }
    if (type === 'pass') {
        modalState = 'pass';
        buildPassPanel();
        passPanel.style.display = 'flex';
        modalOverlay.classList.add('open');
        return;
    }
    showQuestionPanel();
    modalState = 'question';
    modalOverlay.classList.add('open');
}

function revealModifier() {
    modifierIntro.style.display = 'none';
    modalState = 'modifier';
    var cell = currentCell;
    modifierPanel.style.display = 'flex';
    modifierIcon.textContent = cell.dataset.modIcon || '✨';
    modifierTitle.textContent = cell.dataset.modTitle || 'МОДИФИКАТОР';
    modifierDesc.textContent = cell.dataset.modDesc || '';
    buildScoringPanel(true);
    scoringPanel.classList.add('visible');
}

function hideAllModalPanels() {
    modifierIntro.style.display = 'none';
    modifierPanel.style.display = 'none';
    catSelectPanel.style.display = 'none';
    auctionPanel.style.display = 'none';
    passPanel.style.display = 'none';
    modalTopic.style.display = 'none';
    modalPoints.style.display = 'none';
    modalPointsBase.style.display = 'none';
    modalPointsMod.style.display = 'none';
    modalQuestion.style.display = 'none';
    modalImage.style.display = 'none';
    modalAnswer.classList.remove('visible');
    if (modalAnswerPreview) modalAnswerPreview.textContent = '';
    scoringPanel.classList.remove('visible');
    adjustRow.style.display = 'flex';
    flipRow.style.display = 'none';
}

function showQuestionPanel() {
    var cell = currentCell;
    var base = parseInt(cell.dataset.points, 10) || 0;
    var final = computeValue(cell);
    var modKey = getModifierKey(cell);
    var mod = modKey ? MODIFIER_REGISTRY[modKey] : null;
    var isPass = (cell.dataset.type === 'pass' && passReceiverPi != null);
    if (isPass) { final = passValue; base = passValue; mod = null; }
    modalTopic.style.display = '';
    modalPoints.style.display = 'inline-flex';
    modalQuestion.style.display = '';
    modalTopic.textContent = cell.dataset.topic;
    modalPoints.classList.remove('pos', 'neg');
    if (mod && mod.sign === 'pos') modalPoints.classList.add('pos');
    else if (mod && mod.sign === 'neg') modalPoints.classList.add('neg');
    if (!isPass && mod && mod.apply && final !== base) {
        modalPointsBase.style.display = '';
        modalPointsBase.textContent = base;
    } else modalPointsBase.style.display = 'none';
    modalPointsVal.textContent = final;
    if (mod) {
        modalPointsMod.style.display = '';
        modalPointsMod.textContent = mod.label;
    } else modalPointsMod.style.display = 'none';
    modalQuestion.textContent = cell.dataset.question;
    if (cell.dataset.type === 'manual') {
        modalAnswer.textContent = '';
    } else {
        modalAnswer.textContent = cell.dataset.answer || 'не указан';
    }
    if (modalAnswerPreview) {
        var a = cell.dataset.answer || '';
        modalAnswerPreview.textContent = a ? ('Ответ для ведущего:\n' + a) : '';
    }
    if (cell.dataset.image) {
        modalImage.src = cell.dataset.image;
        modalImage.style.display = '';
    } else { modalImage.src = ''; modalImage.style.display = 'none'; }

    buildScoringPanel(false);
    scoringPanel.classList.add('visible');
}

function buildPassPanel() {
    passTopicLabel.textContent = currentCell.dataset.topic || '';
    var minVal = parseInt(currentCell.dataset.minValue, 10) || 200;
    var maxVal = parseInt(currentCell.dataset.maxValue, 10) || 1000;
    passValueInput.min = minVal;
    passValueInput.max = maxVal;
    passValueInput.step = 100;
    var def = Math.round(((minVal + maxVal) / 2) / 100) * 100;
    if (def < minVal) def = minVal;
    if (def > maxVal) def = maxVal;
    passValueInput.value = def;

    passPresets.innerHTML = '';
    [200, 400, 600, 800, 1000].forEach(function(v) {
        if (v < minVal || v > maxVal) return;
        var b = document.createElement('button');
        b.className = 'bid-preset';
        b.textContent = v;
        b.addEventListener('click', function() { passValueInput.value = v; });
        passPresets.appendChild(b);
    });

    passSelectRow.innerHTML = '';
    var round = currentGame.rounds[currentRound];
    (round.playerIndices || []).forEach(function(pi) {
        var name = currentGame.players[pi] || ('Игрок ' + (pi + 1));
        var score = (roundScores[currentRound] && roundScores[currentRound][pi]) || 0;
        var btn = document.createElement('button');
        btn.className = 'select-player-btn';
        btn.innerHTML = '<div class="select-player-name"></div><div class="select-player-score"></div>';
        btn.querySelector('.select-player-name').textContent = name;
        btn.querySelector('.select-player-score').textContent = score;
        btn.addEventListener('click', function() { selectPassReceiver(pi); });
        passSelectRow.appendChild(btn);
    });
}

function selectPassReceiver(pi) {
    var val = parseInt(passValueInput.value, 10) || 0;
    var minVal = parseInt(passValueInput.min, 10) || 200;
    var maxVal = parseInt(passValueInput.max, 10) || 1000;
    if (val < minVal || val > maxVal) {
        alert('Введите значение от ' + minVal + ' до ' + maxVal);
        return;
    }
    passReceiverPi = pi;
    passValue = val;
    passPanel.style.display = 'none';
    showQuestionPanel();
    modalState = 'question';
}

bidMinus.addEventListener('click', function() {
    var step = parseInt(bidInput.step, 10) || 100;
    bidInput.value = Math.max(0, (parseInt(bidInput.value, 10) || 0) - step);
});
bidPlus.addEventListener('click', function() {
    var step = parseInt(bidInput.step, 10) || 100;
    bidInput.value = (parseInt(bidInput.value, 10) || 0) + step;
});

passValueMinus.addEventListener('click', function() {
    var step = parseInt(passValueInput.step, 10) || 100;
    var minVal = parseInt(passValueInput.min, 10) || 200;
    passValueInput.value = Math.max(minVal, (parseInt(passValueInput.value, 10) || minVal) - step);
});
passValuePlus.addEventListener('click', function() {
    var step = parseInt(passValueInput.step, 10) || 100;
    var maxVal = parseInt(passValueInput.max, 10) || 1000;
    passValueInput.value = Math.min(maxVal, (parseInt(passValueInput.value, 10) || 200) + step);
});

function showAnswer() {

}

function buildScoringPanel(isModifier) {
    playerSelectRow.innerHTML = '';
    selectedScoringPi = null;
    adjustMinus.disabled = true; adjustPlus.disabled = true; adjustFlip.disabled = true;
    var round = currentGame.rounds[currentRound];
    var playerIndices = round.playerIndices || [];
    var type = currentCell.dataset.type || 'normal';
    var modKey = getModifierKey(currentCell);
    var mod = modKey ? MODIFIER_REGISTRY[modKey] : null;
    var isFlip = !isModifier && mod && mod.special === 'flip';
    var baseValue;
    if (isModifier) {
        baseValue = parseInt(currentCell.dataset.modValue, 10) || parseInt(currentCell.dataset.points, 10) || 0;
    } else if (type === 'auction' && auctionWinnerPi != null) baseValue = auctionBid;
    else if (type === 'pass' && passReceiverPi != null) baseValue = passValue;
    else baseValue = computeValue(currentCell);
    
    if(scoreInput) scoreInput.value = baseValue;
    
    if (isFlip) { adjustRow.style.display = 'none'; flipRow.style.display = 'flex'; }
    else { adjustRow.style.display = 'flex'; flipRow.style.display = 'none'; }
    
    playerIndices.forEach(function(pi) {
        var name = currentGame.players[pi] || ('Игрок ' + (pi + 1));
        var score = (roundScores[currentRound] && roundScores[currentRound][pi]) || 0;
        var btn = document.createElement('button');
        btn.className = 'player-select-btn';
        btn.dataset.pi = pi;
        if (!isModifier && ((type === 'cat' && catReceiverPi != null && pi !== catReceiverPi) ||
            (type === 'auction' && auctionWinnerPi != null && pi !== auctionWinnerPi) ||
            (type === 'pass' && passReceiverPi != null && pi !== passReceiverPi))) {
            btn.classList.add('locked');
        }
        btn.innerHTML = '<div class="psb-name"></div><div class="psb-score"></div>';
        btn.querySelector('.psb-name').textContent = name;
        var sEl = btn.querySelector('.psb-score');
        sEl.textContent = score;
        if (score < 0) sEl.classList.add('negative');
        if (!btn.classList.contains('locked')) {
            btn.addEventListener('click', function() { selectScoringPlayer(pi); });
        }
        playerSelectRow.appendChild(btn);
    });
    if (!isModifier) {
        if (type === 'cat' && catReceiverPi != null) selectScoringPlayer(catReceiverPi);
        else if (type === 'auction' && auctionWinnerPi != null) selectScoringPlayer(auctionWinnerPi);
        else if (type === 'pass' && passReceiverPi != null) selectScoringPlayer(passReceiverPi);
    }
    renderScorePanel();
}

function selectScoringPlayer(pi) {
    selectedScoringPi = pi;
    var btns = playerSelectRow.querySelectorAll('.player-select-btn');
    btns.forEach(function(b) {
        if (b.classList.contains('locked')) return;
        b.classList.toggle('selected', parseInt(b.dataset.pi, 10) === pi);
    });
    adjustMinus.disabled = false; adjustPlus.disabled = false; adjustFlip.disabled = false;
    renderScorePanel();
}

function updateScoringPanelScores() {
    var btns = playerSelectRow.querySelectorAll('.player-select-btn');
    btns.forEach(function(btn) {
        var pi = parseInt(btn.dataset.pi, 10);
        var score = (roundScores[currentRound] && roundScores[currentRound][pi]) || 0;
        var el = btn.querySelector('.psb-score');
        el.textContent = score;
        el.classList.toggle('negative', score < 0);
    });
}

function adjustRoundScore(delta) {
    if (selectedScoringPi == null) return;
    roundScores[currentRound][selectedScoringPi] = (roundScores[currentRound][selectedScoringPi] || 0) + delta;
    updateScoringPanelScores(); renderScorePanel();
}

function flipSelectedScore() {
    if (selectedScoringPi == null) return;
    var cur = roundScores[currentRound][selectedScoringPi] || 0;
    roundScores[currentRound][selectedScoringPi] = -cur;
    updateScoringPanelScores(); renderScorePanel();
}

function closeQuestion() {

    }

    if (mqttClient && !playerMode) {
        mqttClient.publish("svoya_game_" + roomCode, JSON.stringify({ type: 'question_closed' }));
    }

function endRound() {
    var scores = roundScores[currentRound] || {};
    var round = currentGame.rounds[currentRound];
    var playerIndices = round.playerIndices || [];
    var sorted = playerIndices.map(function(pi) {
        return { pi: pi, name: currentGame.players[pi] || ('Игрок ' + (pi + 1)), score: scores[pi] != null ? scores[pi] : 0 };
    }).sort(function(a, b) { return b.score - a.score; });
    roundWinners[currentRound] = sorted[0] ? sorted[0].pi : null;
    breakLabel.textContent = 'Раунд ' + (currentRound + 1) + ' завершён';
    breakTitle.textContent = 'Итоги'; breakSubtitle.textContent = '';
    breakScores.innerHTML = '';
    sorted.forEach(function(p, i) {
        var row = document.createElement('div');
        row.className = 'break-score-row ' + (i === 0 ? 'winner' : 'loser');
        row.innerHTML = '<div class="break-score-name"></div><div class="break-score-value"></div>';
        row.querySelector('.break-score-name').textContent = (i === 0 ? '🏆 ' : '') + p.name;
        row.querySelector('.break-score-value').textContent = p.score;
        breakScores.appendChild(row);
    });
    breakOverlay.dataset.mode = 'round-results';
    breakOverlay.classList.add('open');
}

    }).filter(function(x) { return x != null; });

    breakTitle.textContent = 'Финал';

}

function eliminateFinalTopic(idx) {
    if (finalState !== 'select') return;
    finalRemaining = finalRemaining.filter(function(i) { return i !== idx; });
    finalEliminated++;
    if (finalRemaining.length === 1) {
        finalCurrentTopic = currentGame.finalTopics[finalRemaining[0]];
        finalState = 'reveal';
        finalSelectView.style.display = 'none'; finalRevealView.style.display = 'flex';
        finalRevealTitle.textContent = finalCurrentTopic.title;
    } else if (finalRemaining.length === 0) {
        finalState = 'reveal';
        finalCurrentTopic = { title: '—', question: '—', answer: '—' };
        finalSelectView.style.display = 'none'; finalRevealView.style.display = 'flex';
        finalRevealTitle.textContent = finalCurrentTopic.title;

function toggleFullscreen() {
    var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
    if (!fsEl) {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (req) {
            var p = req.call(el);
            if (p && p.catch) p.catch(function(err) { alert('Фуллскрин: ' + err.message); });
        }
    } else {
        var exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (exit) exit.call(document);
    }
}

}

function openEditor(gameId) {
    var game = getGame(gameId);
    if (!game) return;
    migrateGame(game);
    editingGameId = gameId;
    editorTextarea.value = JSON.stringify({
        title: game.title || '', subtitle: game.subtitle || '',
        finalQuestionValue: game.finalQuestionValue || 1000,
        players: game.players || [], rounds: game.rounds || [], finalTopics: game.finalTopics || []
    }, null, 2);
    editorGameTitle.textContent = game.title || 'Без названия';
    editorStatus.textContent = ''; editorStatus.className = 'editor-status';
    editorOverlay.classList.add('open');
}

function closeEditor() { editorOverlay.classList.remove('open'); editingGameId = null; }

function saveEditor() {
    if (!editingGameId) return;
    try {
        var parsed = JSON.parse(editorTextarea.value);
        if (!Array.isArray(parsed.rounds)) throw new Error('Нужно поле "rounds"');
        if (!Array.isArray(parsed.finalTopics)) throw new Error('Нужно поле "finalTopics"');
        if (!Array.isArray(parsed.players)) throw new Error('Нужно поле "players"');
        var game = getGame(editingGameId);
        if (!game) throw new Error('Игра не найдена');
        game.title = parsed.title || game.title;
        game.subtitle = parsed.subtitle || '';
        game.finalQuestionValue = typeof parsed.finalQuestionValue === 'number' ? parsed.finalQuestionValue : 1000;
        game.players = parsed.players; game.rounds = parsed.rounds; game.finalTopics = parsed.finalTopics;
        saveData();
        editorGameTitle.textContent = game.title;
        editorStatus.textContent = '✓ Сохранено'; editorStatus.className = 'editor-status ok';
        if (currentGameId === editingGameId) {
            currentGame = game;
            gameTitleEl.textContent = game.title; gameSubtitleEl.textContent = game.subtitle;
            answeredCells = new Set();
            if (currentRound >= game.rounds.length) currentRound = 0;
            roundScores = {};
            game.rounds.forEach(function(r, idx) {
                roundScores[idx] = {};
                (r.playerIndices || []).forEach(function(pi) { roundScores[idx][pi] = 0; });
            });
            renderBoard(); renderScorePanel();
        }
    } catch (e) {
        editorStatus.textContent = '✗ Ошибка: ' + e.message;
        editorStatus.className = 'editor-status err';
    }
}

var IS_PUBLIC = (new URLSearchParams(location.search).get('mode') === 'public');
var playerMode = (new URLSearchParams(location.search).get('mode') === 'player');
var mqttClient = null;
var roomCode = "";
var myName = "";
var currentTurnName = "";
var buzzerQueue = [];

if (!playerMode && !IS_PUBLIC) {
    roomCode = Math.floor(1000 + Math.random() * 9000).toString();
    var codeDisplay = document.createElement('div');
    codeDisplay.style.cssText = 'position:fixed;top:20px;left:20px;background:var(--gold);color:#000;padding:15px;font-weight:bold;font-size:24px;z-index:1000;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.5);font-family:Georgia,serif;';
    codeDisplay.innerHTML = 'Код для игроков: ' + roomCode;
    document.body.appendChild(codeDisplay);
}

function initMQTT(isHost, code) {
    var clientId = "svoya_" + Math.random().toString(16).substr(2, 8);
    var host = "wss://broker.emqx.io:8084/mqtt";
    
    mqttClient = mqtt.connect(host, { clientId: clientId });
    var topic = "svoya_game_" + code;

    mqttClient.on('connect', function () {
        mqttClient.subscribe(topic);
        if (!isHost) {
            document.getElementById('playerLobby').style.display = 'none';
            document.getElementById('playerGame').style.display = 'flex';
            document.getElementById('playerNameDisplay').textContent = myName;
            document.getElementById('playerStatus').textContent = "Подключено! Ждем остальных...";
        }
    });

    mqttClient.on('message', function (topic, message) {
        var data = JSON.parse(message.toString());
        
        // --- ЛОГИКА ВЕДУЩЕГО ---
        if (isHost) {
            if (data.type === 'buzz') {
                if (!buzzerQueue.includes(data.name)) {
                    buzzerQueue.push(data.name);
                    updateHostBuzzerUI();
                }
            }
            if (data.type === 'select_topic') {
                var cell = document.querySelector('.cell-points[data-key="' + data.key + '"]');
                if (cell && !cell.classList.contains('answered')) {
                    openQuestion(cell);
                }
            }
        } 
        // --- ЛОГИКА ИГРОКА ---
        else {
            if (data.type === 'turn') {
                currentTurnName = data.name;
                if (myName === currentTurnName) {
                    document.getElementById('playerStatus').textContent = "Твой ход!";
                    document.getElementById('playerBoard').style.display = 'flex';
                    renderPlayerBoard();
                } else {
                    document.getElementById('playerStatus').textContent = "Ход игрока: " + currentTurnName;
                    document.getElementById('playerBoard').style.display = 'none';
                }
            }
            if (data.type === 'question_opened') {
                document.getElementById('buzzBtn').style.display = 'block';
                document.getElementById('playerBoard').style.display = 'none';
                document.getElementById('playerStatus').textContent = "ВНИМАНИЕ, ВОПРОС!";
            }
            if (data.type === 'question_closed') {
                document.getElementById('buzzBtn').style.display = 'none';
            }
            if (data.type === 'reset_buzzers') {
                document.getElementById('buzzBtn').style.display = 'block';
            }
        }
    });
}

function connectPlayer() {
    var room = document.getElementById('playerRoomInput').value.trim();
    myName = document.getElementById('playerNameInput').value.trim();
    if (!room || !myName) { alert("Введите код и имя!"); return; }
    roomCode = room;
    initMQTT(false, room);
}

function buzz() {
    if (!mqttClient) return;
    mqttClient.publish("svoya_game_" + roomCode, JSON.stringify({ type: 'buzz', name: myName }));
    document.getElementById('buzzBtn').style.display = 'none';
    document.getElementById('playerStatus').textContent = "Ждём решения ведущего...";
}

function renderPlayerBoard() {
    var container = document.getElementById('playerTopics');
    container.innerHTML = '';
    var round = currentGame.rounds[currentRound];
    round.topics.forEach(function(topic, ti) {
        topic.questions.forEach(function(q, qi) {
            var key = currentRound + '-' + ti + '-' + qi;
            if (!answeredCells.has(key)) {
                var btn = document.createElement('button');
                btn.className = 'player-topic-btn';
                btn.innerHTML = '<div class="pt-title">' + topic.title + '</div><div class="pt-points">' + q.points + '</div>';
                btn.onclick = function() {
                    if (!mqttClient) return;
                    mqttClient.publish("svoya_game_" + roomCode, JSON.stringify({ type: 'select_topic', key: key }));
                    document.getElementById('playerBoard').style.display = 'none';
                };
                container.appendChild(btn);
            }
        });
    });
}

function updateHostBuzzerUI() {
    var buzzerContainer = document.getElementById('hostBuzzerContainer');
    if (!buzzerContainer) {
        buzzerContainer = document.createElement('div');
        buzzerContainer.id = 'hostBuzzerContainer';
        buzzerContainer.style.cssText = 'position:fixed;bottom:20px;left:20px;background:rgba(6,18,44,0.95);border:3px solid var(--gold);padding:20px;z-index:1000;border-radius:10px;min-width:250px;';
        document.body.appendChild(buzzerContainer);
    }
    var html = '<h3 style="color:var(--gold);margin-bottom:10px;font-size:20px;">Кто нажал первым:</h3>';
    if (buzzerQueue.length === 0) html += '<div style="color:#9aa8d0;">Пока никто...</div>';
    buzzerQueue.forEach(function(name, i) { 
        html += '<div style="font-size:20px;color:#fff;margin-top:5px;font-weight:bold;">' + (i+1) + '. ' + name + '</div>'; 
    });
    html += '<div style="font-size:12px;color:#9aa8d0;margin-top:15px;">Нажмите "T", чтобы дать ход первому нажавшему</div>';
    buzzerContainer.innerHTML = html;
}

function resetBuzzers() {
    buzzerQueue = [];
    updateHostBuzzerUI();
    if (mqttClient) mqttClient.publish("svoya_game_" + roomCode, JSON.stringify({ type: 'reset_buzzers' }));
}

document.addEventListener('keydown', function(e) {
    if ((e.key === 't' || e.key === 'е') && buzzerQueue.length > 0 && !playerMode) {
        var nextPlayer = buzzerQueue[0];
        currentTurnName = nextPlayer;
        if (mqttClient) mqttClient.publish("svoya_game_" + roomCode, JSON.stringify({ type: 'turn', name: nextPlayer }));
        alert("Ход передан игроку: " + nextPlayer + " (Он может выбрать тему)");
        resetBuzzers();
    }
});

startGame = function(gameId) {
    originalStartGame(gameId);
    if (!playerMode) initMQTT(true, roomCode);
};

if (playerMode) {
    showScreen('playerScreen');
}

// ==========================================
// ЭКРАН ЗРИТЕЛЯ (PUBLIC MODE)
// ==========================================
var BC = (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('svoya-igra-sync') : null;
var PUBLIC_STATE_KEY = 'svoya-public-state';
var PUBLIC_STATE_TS = 'svoya-public-state-ts';

function buildPublicState() {
    return {
        screen: gameScreen.classList.contains('active') ? 'game' : 'menu',
        gameId: currentGameId,
        round: currentRound,
        roundScores: roundScores,
        answeredCells: Array.from(answeredCells),
        selectedScoringPi: selectedScoringPi,
        modalOpen: modalOverlay.classList.contains('open'),
        modalState: modalState,
        currentCell: currentCell ? {
            key: currentCell.dataset.key || '',
            topic: currentCell.dataset.topic || '',
            points: currentCell.dataset.points || '',
            question: currentCell.dataset.question || '',
            answer: currentCell.dataset.answer || '',
            image: currentCell.dataset.image || '',
            type: currentCell.dataset.type || '',
            modifier: currentCell.dataset.modifier || '',
            modTitle: currentCell.dataset.modTitle || '',
            modDesc: currentCell.dataset.modDesc || '',
            modIcon: currentCell.dataset.modIcon || '',
            modValue: currentCell.dataset.modValue || ''
        } : null,
        catReceiverPi: catReceiverPi,
        auctionWinnerPi: auctionWinnerPi,
        passReceiverPi: passReceiverPi,
        passValue: passValue,
        secretModifierKey: secretModifierKey,
        breakOpen: breakOverlay.classList.contains('open'),
        breakMode: breakOverlay.dataset.mode || '',
        breakLabel: breakLabel.textContent,
        breakTitle: breakTitle.textContent,
        breakSubtitle: breakSubtitle.textContent,
        breakScoresHtml: breakScores.innerHTML,
        finalOpen: finalOverlay.classList.contains('open'),
        finalState: finalState,
        finalRemaining: finalRemaining,
        finalCurrentTopic: finalCurrentTopic,
        finalists: finalists,
        finalScores: finalScores,
        finalEliminated: finalEliminated,
        finalRevealTitle: finalRevealTitle.textContent
    };
}

var _bcTimer = null;
function broadcast() {
    if (IS_PUBLIC) return;
    var state = buildPublicState();
    try {
        localStorage.setItem(PUBLIC_STATE_KEY, JSON.stringify(state));
        localStorage.setItem(PUBLIC_STATE_TS, String(Date.now()));
    } catch (e) {}
    if (BC) { try { BC.postMessage({ type: 'state', state: state }); } catch (e) {} }
}

function applyPublicState(state) {
    if (!state) return;
    if (state.gameId) {
        currentGameId = state.gameId;
        currentGame = getGame(state.gameId);
    } else { currentGameId = null; currentGame = null; }

    currentRound = state.round || 0;
    roundScores = state.roundScores || {};
    answeredCells = new Set(state.answeredCells || []);
    selectedScoringPi = state.selectedScoringPi;
    modalState = state.modalState || 'question';
    catReceiverPi = state.catReceiverPi;
    auctionWinnerPi = state.auctionWinnerPi;
    passReceiverPi = state.passReceiverPi;
    passValue = state.passValue || 0;
    secretModifierKey = state.secretModifierKey;
    finalState = state.finalState || 'select';
    finalRemaining = state.finalRemaining || [];
    finalCurrentTopic = state.finalCurrentTopic;
    finalists = state.finalists || [];
    finalScores = state.finalScores || {};
    finalEliminated = state.finalEliminated || 0;

    if (state.screen === 'menu') {
        showScreen('menuScreen');
        modalOverlay.classList.remove('open');
        breakOverlay.classList.remove('open');
        finalOverlay.classList.remove('open');
        return;
    }
    showScreen('gameScreen');
    if (!currentGame) return;

    gameTitleEl.textContent = currentGame.title || 'Своя игра';
    gameSubtitleEl.textContent = currentGame.subtitle || '';
    renderBoard();
    renderScorePanel();
    hideAllModalPanels();
    if (state.modalOpen && state.currentCell) {
        var c = state.currentCell;
        var fake = document.createElement('div');
        ['key','topic','points','question','answer','image','type','modifier','modTitle','modDesc','modIcon','modValue'].forEach(function(k) {
            if (c[k]) fake.dataset[k] = c[k];
        });
        currentCell = fake;
        if (modalState === 'modifier-intro') {
            modifierIntro.style.display = 'flex';
            modalOverlay.classList.add('open');
        } else if (modalState === 'modifier') {
            modifierPanel.style.display = 'flex';
            modifierIcon.textContent = fake.dataset.modIcon || '✨';
            modifierTitle.textContent = fake.dataset.modTitle || 'МОДИФИКАТОР';
            modifierDesc.textContent = fake.dataset.modDesc || '';
            modalOverlay.classList.add('open');
        } else if (modalState === 'question') {
            showQuestionPanel();
            modalOverlay.classList.add('open');
        } else if (modalState === 'answer') {
            showQuestionPanel();
            modalQuestion.style.display = 'none';
            modalImage.style.display = 'none';
            if (fake.dataset.type !== 'manual') modalAnswer.classList.add('visible');
            modalOverlay.classList.add('open');
        } else { 
            currentCell = null; 
            modalOverlay.classList.remove('open'); 
        }
    } else { 
        currentCell = null; 
        modalOverlay.classList.remove('open'); 
    }

    if (state.breakOpen) {
        breakLabel.textContent = state.breakLabel || '';
        breakTitle.textContent = state.breakTitle || '';
        breakSubtitle.textContent = state.breakSubtitle || '';
        breakScores.innerHTML = state.breakScoresHtml || '';
        breakOverlay.dataset.mode = state.breakMode || '';
        breakOverlay.classList.add('open');
    } else { breakOverlay.classList.remove('open'); }

    if (state.finalOpen) {
        finalSelectView.style.display = 'none';
        finalRevealView.style.display = 'none';
        finalQuestionView.style.display = 'none';
        finalAnswerText.classList.remove('visible');
        finalScoringPanel.classList.remove('visible');
        if (state.finalState === 'select') {
            finalSelectView.style.display = 'flex';
            finalTurn.textContent = 'Ход игрока ' + ((state.finalEliminated % 3) + 1);
            finalTopicsEl.innerHTML = '';
            finalRemaining.forEach(function(idx) {
                var topic = currentGame.finalTopics[idx];
                var card = document.createElement('div');
                card.className = 'final-topic-card';
                card.textContent = topic.title;
                finalTopicsEl.appendChild(card);
            });
        } else if (state.finalState === 'reveal') {
            finalRevealView.style.display = 'flex';
            finalRevealTitle.textContent = state.finalRevealTitle || '';
        } else if (state.finalState === 'question') {
            finalQuestionView.style.display = 'flex';
            finalTopicSmall.textContent = state.finalCurrentTopic ? state.finalCurrentTopic.title : '';
            finalQuestionText.textContent = state.finalCurrentTopic ? state.finalCurrentTopic.question : '';
            finalQuestionText.style.display = '';
        } else if (state.finalState === 'answer') {
            finalQuestionView.style.display = 'flex';
            finalTopicSmall.textContent = state.finalCurrentTopic ? state.finalCurrentTopic.title : '';
            finalQuestionText.style.display = 'none';
            finalAnswerText.textContent = ((state.finalCurrentTopic && state.finalCurrentTopic.answer) || 'не указан');
            finalAnswerText.classList.add('visible');
        }
        finalOverlay.classList.add('open');
    } else { finalOverlay.classList.remove('open'); }
}

if (IS_PUBLIC) {
    document.body.classList.add('public-mode');
    if (BC) {
        BC.onmessage = function(ev) { if (ev.data && ev.data.type === 'state') applyPublicState(ev.data.state); };
        BC.postMessage({ type: 'public-ready' });
    }
    window.addEventListener('storage', function(e) {
        if (e.key === PUBLIC_STATE_TS) {
            try {
                var s = JSON.parse(localStorage.getItem(PUBLIC_STATE_KEY));
                if (s) applyPublicState(s);
            } catch(err) {}
        }
        if (e.key === STORAGE_KEY) { appData = loadData(); }
    });
}

if (!IS_PUBLIC && !playerMode) {
    var btnPublicScreen = document.getElementById('btnPublicScreen');
    if (btnPublicScreen) {
        btnPublicScreen.addEventListener('click', function() {
            var base = location.href.split('?')[0];
            window.open(base + '?mode=public', '_blank');
        });
    }
    [
        'startGame','backToMenu','goToRound','nextRound',
        'openQuestion','revealModifier','selectCatReceiver','selectAuctionWinner','selectPassReceiver',
        'showAnswer','selectScoringPlayer','adjustRoundScore','flipSelectedScore',
        'closeQuestion','endRound','showFinalIntro','startFinalRound',
        'eliminateFinalTopic','showFinalQuestion','showFinalAnswer',
        'selectFinalPlayer','adjustFinalScore','closeFinalRound',
        'resetGame','saveEditor'
    ].forEach(function(name) {
        if (typeof window[name] === 'function' && !window['_wrapped_' + name]) {
            window['_wrapped_' + name] = true;
            var orig = window[name];
            window[name] = function() {
                var r = orig.apply(this, arguments);
                broadcast();
                return r;
            };
        }
    });
    if (BC) { BC.onmessage = function(ev) { if (ev.data && ev.data.type === 'public-ready') broadcast(); }; }
    setTimeout(broadcast, 600);
}

renderMenu();
showScreen('menuScreen');
</script>
